<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="popup.title">YouTube speed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="speed.title">Speed</h1>
      <output id="rate" class="rate" for="slider">–</output>
    </header>

    <p id="status" class="status" hidden></p>

    <section id="controls">
      <input type="range" id="slider" min="0" max="9" step="1" value="0" disabled data-i18n-attr="aria-label:speed.aria">
      <div id="ticks" class="ticks" aria-hidden="true"></div>
      <button type="button" id="reset" class="ghost" disabled>1×</button>
      <p class="hint" data-i18n="popup.kbd"></p>
      <p class="hint">
        <span data-i18n="popup.shortcut"></span>
        <span id="shortcutText" class="kbd">Alt+S</span>
        <button type="button" id="changeShortcut" class="link" data-i18n="popup.change"></button>
      </p>
    </section>

    <label class="sb-toggle">
      <input type="checkbox" id="sbEnabled">
      <span data-i18n="popup.sb"></span>
    </label>

    <details id="settings">
      <summary data-i18n="popup.customize"></summary>

      <label for="speedsInput" data-i18n="popup.listHelp"></label>
      <input type="text" id="speedsInput" spellcheck="false" autocomplete="off" placeholder="0.5, 1, 1.5, 2, 3">

      <div class="row">
        <button type="button" id="save" data-i18n="save"></button>
        <button type="button" id="defaults" class="ghost" data-i18n="restore"></button>
      </div>
      <p id="msg" class="msg" role="status"></p>

      <label class="check">
        <input type="checkbox" id="remember">
        <span data-i18n="remember"></span>
      </label>
    </details>
  </main>
  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
